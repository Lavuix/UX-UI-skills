<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакты — прототип</title>
<style>
/*
  Токены дизайн-системы «Life» (TN Life) — CSS custom properties.
  Источник значений: ../tokens.md (реальные значения из Figma).
  Не редактировать значения руками — если токен изменился в Figma,
  поправь ../tokens.md и синхронизируй этот файл.

  Использование в HTML-прототипах (см. .claude/skills/html-prototype/SKILL.md):
  вставь содержимое этого файла целиком в <style> прототипа (прототип должен
  быть самодостаточным .html файлом, без внешних зависимостей), дальше бери
  только переменные — не хардкодь HEX/px вручную.

  Тема по умолчанию — Light. Для тёмной темы добавь на корневой элемент
  data-theme="dark".
*/

:root {
  /* Отступы (Spaces) */
  --space-none: 0px;
  --space-4: 4px;
  --space-8: 8px;
  --space-10: 10px;
  --space-12: 12px;
  --space-16: 16px;
  --space-24: 24px;
  --space-32: 32px;
  --space-40: 40px;
  --space-48: 48px;
  --space-64: 64px;

  /* Радиусы (Radiuses) */
  --radius-none: 0px;
  --radius-2: 2px;
  --radius-4: 4px;
  --radius-8: 8px;
  --radius-10: 10px;
  --radius-12: 12px;
  --radius-16: 16px;
  --radius-24: 24px;
  --radius-round: 100px;

  /* Семантические цвета — Light (по умолчанию) */
  --content-primary-a: #1E2228;
  --content-primary-a-hover: #444C59;
  --content-primary-a-pressed: #000000;
  --content-primary-a-disabled: #BCC1CE;

  --content-primary-b: #FFFFFF;
  --content-primary-b-hover: #FFFFFF;
  --content-primary-b-pressed: #FFFFFF;
  --content-primary-b-disabled: #BCC1CE;

  --content-secondary: #667387;
  --content-secondary-hover: #7A879D;
  --content-secondary-pressed: #4E5867;
  --content-secondary-disabled: #BCC1CE;

  --content-tertiary: #9CA3B6;
  --content-tertiary-hover: #ABB0C1;
  --content-tertiary-pressed: #7A879D;
  --content-tertiary-disabled: #BCC1CE;

  --content-accent: #E11B11;
  --content-accent-hover: #AE1603;
  --content-accent-pressed: #961500;
  --content-accent-disabled: #BCC1CE;

  --content-system-positive: #009C37;
  --content-system-negative: #E11B11;
  --content-system-warning: #FF8A0C;
  --content-system-neutral: #4E5867;

  --content-action: #1284FF;
  --content-action-hover: #006EE4;
  --content-action-pressed: #004998;
  --content-action-disabled: #BCC1CE;

  --background-primary-a: #FFFFFF;
  --background-primary-a-hover: #FCFCFD;
  --background-primary-a-pressed: #F9F9FA;
  --background-primary-a-disabled: #F9F9FA;

  --background-primary-b: #1E2228;
  --background-primary-b-hover: #444C59;
  --background-primary-b-pressed: #000000;
  --background-primary-b-disabled: #BCC1CE;

  --background-secondary-a: #F3F5F7;
  --background-secondary-a-hover: #E6E8ED;
  --background-secondary-a-pressed: #D7DAE1;
  --background-secondary-a-disabled: #F9F9FA;

  --background-secondary-b: #4E5867;
  --background-secondary-b-hover: #7A879D;
  --background-secondary-b-pressed: #3B434F;
  --background-secondary-b-disabled: #F9F9FA;

  --background-tertiary: #E6E8ED;
  --background-tertiary-hover: #D7DAE1;
  --background-tertiary-pressed: #C8CCD6;
  --background-tertiary-disabled: #F9F9FA;

  --background-accent: #E11B11;
  --background-accent-hover: #AE1603;
  --background-accent-pressed: #961500;
  --background-accent-disabled: #F9F9FA;

  --border-primary-a: #1E2228;
  --border-primary-a-hover: #444C59;
  --border-primary-a-pressed: #000000;
  --border-primary-a-disabled: #E6E8ED;

  --border-primary-b: #FFFFFF;
  --border-primary-b-hover: #E6E8ED;
  --border-primary-b-pressed: #D7DAE1;
  --border-primary-b-disabled: #E6E8ED;

  --border-secondary: #D7DAE1;
  --border-secondary-hover: #C8CCD6;
  --border-secondary-pressed: #BCC1CE;
  --border-secondary-disabled: #E6E8ED;

  --border-accent: #E11B11;
  --border-accent-hover: #AE1603;
  --border-accent-pressed: #961500;
  --border-accent-disabled: #E6E8ED;

  /* Типографика — режим Web (px) */
  --font-family-heading: "Inter", -apple-system, "Segoe UI", sans-serif;
  --font-family-body: "Inter", -apple-system, "Segoe UI", sans-serif;

  --font-size-headline-large: 26px;
  --font-size-headline-medium: 22px;
  --font-size-headline-small: 18px;
  --font-size-title-medium: 15px;
  --font-size-title-small: 13px;
  --font-size-body-medium: 15px;
  --font-size-body-small: 13px;
  --font-size-label-medium: 11px;
  --font-size-label-small: 10px;

  --font-weight-text: 400;
  --font-weight-accent: 500;
  --font-weight-heading: 600;

  --line-height-headline-large: 35px;
  --line-height-headline-medium: 30px;
  --line-height-headline-small: 24px;
  --line-height-title-medium: 21px;
  --line-height-title-small: 18px;
  --line-height-body-medium: 23px;
  --line-height-body-small: 20px;
  --line-height-label-medium: 17px;
  --line-height-label-small: 14px;
}

[data-theme="dark"] {
  --content-primary-a: #F3F5F7;
  --content-primary-a-hover: #C8CCD6;
  --content-primary-a-pressed: #D7DAE1;
  --content-primary-a-disabled: #3B434F;

  --content-primary-b: #F3F5F7;
  --content-primary-b-hover: #C8CCD6;
  --content-primary-b-pressed: #D7DAE1;
  --content-primary-b-disabled: #3B434F;

  --content-secondary: #667387;
  --content-secondary-hover: #4E5867;
  --content-secondary-pressed: #3B434F;
  --content-secondary-disabled: #3B434F;

  --content-tertiary: #667387;
  --content-tertiary-hover: #4E5867;
  --content-tertiary-pressed: #3B434F;
  --content-tertiary-disabled: #3B434F;

  --content-accent: #AE1603;
  --content-accent-hover: #841500;
  --content-accent-pressed: #670F00;
  --content-accent-disabled: #3B434F;

  --content-system-positive: #009C37;
  --content-system-negative: #E11B11;
  --content-system-warning: #FF8A0C;
  --content-system-neutral: #4E5867;

  --content-action: #2B91FF;
  --content-action-hover: #006EE4;
  --content-action-pressed: #004998;
  --content-action-disabled: #3B434F;

  --background-primary-a: #1E2228;
  --background-primary-a-hover: #22262D;
  --background-primary-a-pressed: #262A32;
  --background-primary-a-disabled: #262A32;

  --background-primary-b: #ABB0C1;
  --background-primary-b-hover: #8890A7;
  --background-primary-b-pressed: #7A879D;
  --background-primary-b-disabled: #262A32;

  --background-secondary-a: #262A32;
  --background-secondary-a-hover: #292F37;
  --background-secondary-a-pressed: #22262D;
  --background-secondary-a-disabled: #262A32;

  --background-secondary-b: #262A32;
  --background-secondary-b-hover: #292F37;
  --background-secondary-b-pressed: #22262D;
  --background-secondary-b-disabled: #262A32;

  --background-tertiary: #2D333C;
  --background-tertiary-hover: #3B434F;
  --background-tertiary-pressed: #2D333C;
  --background-tertiary-disabled: #262A32;

  --background-accent: #AE1603;
  --background-accent-hover: #841500;
  --background-accent-pressed: #670F00;
  --background-accent-disabled: #262A32;

  --border-primary-a: #FFFFFF;
  --border-primary-a-hover: #E6E8ED;
  --border-primary-a-pressed: #D7DAE1;
  --border-primary-a-disabled: #262A32;

  --border-primary-b: #3B434F;
  --border-primary-b-hover: #444C59;
  --border-primary-b-pressed: #2D333C;
  --border-primary-b-disabled: #262A32;

  --border-secondary: #2D333C;
  --border-secondary-hover: #3B434F;
  --border-secondary-pressed: #3B434F;
  --border-secondary-disabled: #2D333C;

  --border-accent: #E11B11;
  --border-accent-hover: #AE1603;
  --border-accent-pressed: #961500;
  --border-accent-disabled: #262A32;
}

/* Именованные текстовые стили — назначение см. ../tokens.md → «Как это применяется» */
.text-headline-large { font-family: var(--font-family-heading); font-size: var(--font-size-headline-large); line-height: var(--line-height-headline-large); font-weight: var(--font-weight-heading); }
.text-headline-medium { font-family: var(--font-family-heading); font-size: var(--font-size-headline-medium); line-height: var(--line-height-headline-medium); font-weight: var(--font-weight-heading); }
.text-headline-small { font-family: var(--font-family-heading); font-size: var(--font-size-headline-small); line-height: var(--line-height-headline-small); font-weight: var(--font-weight-heading); }

.text-title-medium { font-family: var(--font-family-heading); font-size: var(--font-size-title-medium); line-height: var(--line-height-title-medium); font-weight: var(--font-weight-accent); }
.text-title-small { font-family: var(--font-family-heading); font-size: var(--font-size-title-small); line-height: var(--line-height-title-small); font-weight: var(--font-weight-accent); }

.text-body-medium-light { font-family: var(--font-family-body); font-size: var(--font-size-body-medium); line-height: var(--line-height-body-medium); font-weight: var(--font-weight-text); }
.text-body-medium-hard { font-family: var(--font-family-body); font-size: var(--font-size-body-medium); line-height: var(--line-height-body-medium); font-weight: var(--font-weight-accent); }
.text-body-small-light { font-family: var(--font-family-body); font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); font-weight: var(--font-weight-text); }
.text-body-small-hard { font-family: var(--font-family-body); font-size: var(--font-size-body-small); line-height: var(--line-height-body-small); font-weight: var(--font-weight-accent); }

.text-label-medium-light { font-family: var(--font-family-body); font-size: var(--font-size-label-medium); line-height: var(--line-height-label-medium); font-weight: var(--font-weight-text); }
.text-label-medium-hard { font-family: var(--font-family-body); font-size: var(--font-size-label-medium); line-height: var(--line-height-label-medium); font-weight: var(--font-weight-accent); }
.text-label-small-light { font-family: var(--font-family-body); font-size: var(--font-size-label-small); line-height: var(--line-height-label-small); font-weight: var(--font-weight-text); }
.text-label-small-hard { font-family: var(--font-family-body); font-size: var(--font-size-label-small); line-height: var(--line-height-label-small); font-weight: var(--font-weight-accent); }

/* --- прототип «Контакты» — вёрстка поверх токенов кита --- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--background-secondary-a);
  font-family: var(--font-family-body);
  color: var(--content-primary-a);
  -webkit-font-smoothing: antialiased;
}
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; }

.app { display: flex; height: 100vh; padding: var(--space-8); gap: var(--space-12); }

/* рейл */
.rail {
  width: 64px; flex: none;
  background: var(--background-primary-b);
  border-radius: var(--radius-16);
  display: flex; flex-direction: column; align-items: center;
  padding: var(--space-16) 0; gap: var(--space-8);
}
.rail-icon {
  width: 40px; height: 40px; border-radius: var(--radius-12);
  display: flex; align-items: center; justify-content: center;
  color: var(--content-primary-b); opacity: .5; cursor: pointer;
  background: transparent; border: none;
}
.rail-icon:hover { opacity: .8; background: rgba(255,255,255,.08); }
.rail-icon.active { opacity: 1; background: rgba(255,255,255,.14); }
.rail-icon svg { width: 20px; height: 20px; }

/* основная колонка */
.main { flex: 1; display: flex; flex-direction: column; gap: var(--space-16); min-width: 0; }

.header {
  height: 56px; flex: none;
  background: var(--background-primary-a);
  border-radius: var(--radius-16);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-16); gap: var(--space-16);
}
.header-actions { display: flex; align-items: center; gap: var(--space-12); }

.input-search {
  display: flex; align-items: center; gap: var(--space-8);
  background: var(--background-secondary-a);
  border-radius: var(--radius-round);
  height: 40px; padding: 0 var(--space-16); width: 260px;
}
.input-search svg { flex: none; opacity: .45; }
.input-search input {
  border: none; background: none; outline: none; flex: 1;
  font-family: var(--font-family-body); font-size: 14px; color: var(--content-primary-a);
}
.input-search input::placeholder { color: var(--content-tertiary); }

.btn {
  border: none; cursor: pointer; border-radius: var(--radius-round);
  height: 48px; padding: 0 var(--space-24);
  font-family: var(--font-family-heading); font-size: 15px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8);
  white-space: nowrap;
}
.btn-primary { background: var(--content-action); color: #fff; }
.btn-primary:hover { background: var(--content-action-hover); }
.btn-neutral { background: var(--background-tertiary); color: var(--content-primary-a); }
.btn-neutral:hover { background: var(--background-tertiary-hover); }
.btn-link { background: none; color: var(--content-secondary); height: auto; padding: var(--space-12) var(--space-8); }
.btn-link:hover { color: var(--content-primary-a); }

.workspace { flex: 1; min-height: 0; display: flex; gap: var(--space-16); position: relative; }

.content-island {
  flex: 1; min-width: 0;
  background: var(--background-primary-a);
  border-radius: var(--radius-16);
  padding: var(--space-24); overflow-y: auto;
}

.contacts-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--space-12); margin-top: var(--space-16);
}

.contact-card {
  display: flex; align-items: center; gap: var(--space-12);
  padding: var(--space-12) var(--space-16);
  border-radius: var(--radius-12);
  border: 1px solid var(--border-secondary);
  background: var(--background-primary-a);
  cursor: pointer; text-align: left; width: 100%;
  transition: background .12s, border-color .12s;
}
.contact-card:hover { background: var(--background-secondary-a); }
.contact-card.active { border-color: var(--border-accent); background: var(--background-secondary-a); }

.userpic {
  border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--background-secondary-b); color: var(--content-primary-b);
  font-family: var(--font-family-heading); font-weight: 600;
}
.userpic.size-m { width: 40px; height: 40px; font-size: 14px; }
.userpic.size-l { width: 72px; height: 72px; font-size: 24px; margin: 0 auto var(--space-16); }

.contact-card-body { min-width: 0; }
.contact-card-name { display: block; color: var(--content-primary-a); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-card-role { display: block; color: var(--content-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.empty-state { text-align: center; padding: var(--space-48) 0; color: var(--content-secondary); }

/* боковая панель детали (SidePage) */
.sidepage {
  position: absolute; top: 0; right: 0; bottom: 0; width: 420px; max-width: calc(100vw - 32px);
  background: var(--background-primary-a); border-radius: var(--radius-16);
  box-shadow: 0 8px 32px rgba(20, 24, 30, .18);
  transform: translateX(calc(100% + 16px));
  transition: transform .22s ease;
  display: flex; flex-direction: column; z-index: 20;
}
.sidepage.open { transform: translateX(0); }
.sidepage-top { display: flex; justify-content: flex-end; padding: var(--space-16) var(--space-16) 0; flex: none; }
.sidepage-close {
  width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--background-secondary-a); color: var(--content-secondary);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.sidepage-close:hover { background: var(--background-tertiary); }
.sidepage-scroll { overflow-y: auto; padding: 0 var(--space-24) var(--space-24); flex: 1; }

.profile-head { text-align: center; padding-top: var(--space-8); }
.profile-actions { display: flex; gap: var(--space-12); margin: var(--space-24) 0; }
.profile-actions .btn { flex: 1; }

.info-block { border-top: 1px solid var(--border-secondary); padding-top: var(--space-20, var(--space-16)); display: flex; flex-direction: column; gap: var(--space-16); }
.info-row .info-label { color: var(--content-tertiary); margin-bottom: 2px; }
.info-row .info-value { color: var(--content-primary-a); }

.qr-block { border-top: 1px solid var(--border-secondary); margin-top: var(--space-24); padding-top: var(--space-24); text-align: center; }
.qr-wrap { width: 160px; height: 160px; margin: 0 auto; }
.qr-wrap svg { width: 100%; height: 100%; display: block; }
.qr-placeholder {
  width: 160px; height: 160px; margin: 0 auto;
  border: 1px dashed var(--border-secondary); border-radius: var(--radius-12);
  display: flex; align-items: center; justify-content: center;
  color: var(--content-tertiary); font-size: 13px;
}
.qr-caption { color: var(--content-tertiary); max-width: 240px; margin: var(--space-12) auto 0; }

/* затемнение фона под панелью/попапом */
.scrim {
  position: fixed; inset: 0; background: rgba(30, 34, 40, .4);
  opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 15;
}
.scrim.visible { opacity: 1; pointer-events: auto; }

/* попап «добавить контакт» */
.popup-overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  z-index: 30; opacity: 0; pointer-events: none; transition: opacity .18s;
}
.popup-overlay.open { opacity: 1; pointer-events: auto; }
.popup {
  width: 560px; max-width: calc(100vw - 48px);
  background: var(--background-primary-a); border-radius: var(--radius-16);
  padding: var(--space-32); max-height: calc(100vh - 64px); overflow-y: auto;
}
.field { margin-bottom: var(--space-16); }
.field label { display: block; margin-bottom: var(--space-8); color: var(--content-secondary); }
.field input {
  width: 100%; height: 48px; border-radius: var(--radius-12);
  border: 1px solid var(--border-secondary); padding: 0 var(--space-16);
  font-size: 15px; font-family: var(--font-family-body); outline: none;
  background: var(--background-primary-a); color: var(--content-primary-a);
}
.field input:focus { border-color: var(--border-accent); }
.popup-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-12); margin-top: var(--space-24); }

/* тост-уведомление */
.toast {
  position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 16px);
  background: var(--background-primary-b); color: var(--content-primary-b);
  padding: var(--space-12) var(--space-24); border-radius: var(--radius-round);
  font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 50;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <button class="rail-icon" title="Чаты">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H8l-4 4V5Z" stroke-linejoin="round"/></svg>
    </button>
    <button class="rail-icon active" title="Контакты">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke-linecap="round"/></svg>
    </button>
    <button class="rail-icon" title="Встречи">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8 3.5v3M16 3.5v3" stroke-linecap="round"/></svg>
    </button>
    <button class="rail-icon" title="Сервисы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
    </button>
  </aside>

  <div class="main">
    <header class="header">
      <h1 class="text-headline-small">Контакты</h1>
      <div class="header-actions">
        <label class="input-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
          <input id="searchInput" placeholder="Найти по имени или отделу" autocomplete="off">
        </label>
        <button class="btn btn-primary" id="addBtn">+ Добавить контакт</button>
      </div>
    </header>

    <div class="workspace">

var contacts = [
  {id:'c1', name:'Кутовая Софья', role:'Продакт-менеджер', dept:'Дирекция по цифровизации', phone:'+7 916 123-45-67', email:'s.kutovaya@tn.ru'},
  {id:'c2', name:'Колдашев Алексей', role:'Тимлид фронтенда', dept:'Дирекция по цифровизации', phone:'+7 916 234-56-78', email:'a.koldashev@tn.ru'},
  {id:'c3', name:'Леухин Антон', role:'Продуктовый дизайнер', dept:'Дирекция по цифровизации', phone:'+7 916 345-67-89', email:'a.leukhin@tn.ru'},
  {id:'c4', name:'Казанцев Иван', role:'Аналитик', dept:'Гильдия аналитиков', phone:'+7 916 456-78-90', email:'i.kazantsev@tn.ru'},
  {id:'c5', name:'Потаев Денис', role:'ML-инженер', dept:'AI-технологии', phone:'+7 916 567-89-01', email:'d.potaev@tn.ru'},
  {id:'c6', name:'Белова Кристина', role:'HR бизнес-партнёр', dept:'Дирекция по персоналу', phone:'+7 916 678-90-12', email:'k.belova@tn.ru'}
];

var activeId = null;
var grid = document.getElementById('contactsGrid');
var emptyState = document.getElementById('emptyState');

function initials(name){
  var p = name.trim().split(/\s+/);
  return (p[0].charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase();
}

function filteredContacts(){
  var q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  if(!q) return contacts;
  return contacts.filter(function(c){
    return (c.name + ' ' + c.role + ' ' + c.dept).toLowerCase().indexOf(q) !== -1;
  });
}

function renderGrid(list){
  grid.innerHTML = '';
  if(!list.length){ emptyState.style.display = 'block'; return; }
  emptyState.style.display = 'none';
  list.forEach(function(c){
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'contact-card' + (c.id === activeId ? ' active' : '');
    card.innerHTML =
      '<span class="userpic size-m">' + initials(c.name) + '</span>' +
      '<span class="contact-card-body">' +
        '<span class="contact-card-name text-body-medium-hard">' + c.name + '</span>' +
        '<span class="contact-card-role text-body-small-light">' + c.role + ' · ' + c.dept + '</span>' +
      '</span>';
    card.addEventListener('click', function(){ openContact(c.id); });
    grid.appendChild(card);
  });
}

function qrSvg(qr){
  var size = qr.size, rows = qr.rows, cell = 160 / size, rects = '';
  for(var y = 0; y < size; y++){
    var row = rows[y];
    for(var x = 0; x < size; x++){
      if(row.charAt(x) === '1'){
        rects += '<rect x="' + (x * cell).toFixed(2) + '" y="' + (y * cell).toFixed(2) +
          '" width="' + (cell + 0.4).toFixed(2) + '" height="' + (cell + 0.4).toFixed(2) + '"/>';
      }
    }
  }
  return '<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" fill="#1E2228">' + rects + '</svg>';
}

function openContact(id){
  activeId = id;
  var c = contacts.filter(function(x){ return x.id === id; })[0];
  renderGrid(filteredContacts());

  var qr = QR_DATA[id];
  var qrBlockHtml = qr
    ? '<div class="qr-wrap">' + qrSvg(qr) + '</div>' +
      '<p class="qr-caption text-label-medium-light">Наведи камеру телефона на QR — карточка контакта сохранится в телефон</p>'
    : '<div class="qr-placeholder text-label-medium-light">QR</div>' +
      '<p class="qr-caption text-label-medium-light">QR-код появится, когда контакт сохранится на сервере</p>';

  document.getElementById('sidepageContent').innerHTML =
    '<div class="profile-head">' +
      '<div class="userpic size-l">' + initials(c.name) + '</div>' +
      '<h2 class="text-headline-medium">' + c.name + '</h2>' +
      '<p class="text-body-medium-light" style="color:var(--content-secondary);margin-top:4px;">' + c.role + '</p>' +
      '<p class="text-body-small-light" style="color:var(--content-tertiary);margin-top:2px;">' + c.dept + '</p>' +
    '</div>' +
    '<div class="profile-actions">' +
      '<button class="btn btn-primary" id="msgBtn">Написать</button>' +
      '<button class="btn btn-neutral" id="callBtn">Позвонить</button>' +
    '</div>' +
    '<div class="info-block">' +
      '<div class="info-row"><div class="info-label text-label-medium-light">Телефон</div><div class="info-value text-body-medium-light">' + c.phone + '</div></div>' +
      '<div class="info-row"><div class="info-label text-label-medium-light">Почта</div><div class="info-value text-body-medium-light">' + c.email + '</div></div>' +
      '<div class="info-row"><div class="info-label text-label-medium-light">Отдел</div><div class="info-value text-body-medium-light">' + c.dept + '</div></div>' +
    '</div>' +
    '<div class="qr-block">' + qrBlockHtml + '</div>';

  document.getElementById('sidepage').classList.add('open');
  document.getElementById('sidepage').setAttribute('aria-hidden', 'false');
  document.getElementById('scrim').classList.add('visible');

  document.getElementById('msgBtn').addEventListener('click', function(){
    showToast('Открыли бы чат с ' + c.name.split(' ')[0]);
  });
  document.getElementById('callBtn').addEventListener('click', function(){
    showToast('Звонок: ' + c.phone);
  });
}

function closeSidepage(){
  activeId = null;
  var sp = document.getElementById('sidepage');
  sp.classList.remove('open');
  sp.setAttribute('aria-hidden', 'true');
  document.getElementById('scrim').classList.remove('visible');
  renderGrid(filteredContacts());
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('open');
  if(!document.getElementById('sidepage').classList.contains('open')){
    document.getElementById('scrim').classList.remove('visible');
  }
  document.getElementById('addForm').reset();
}

var toastTimer = null;
function showToast(text){
  var t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('visible'); }, 2200);
}

document.getElementById('closeSidepage').addEventListener('click', closeSidepage);
document.getElementById('scrim').addEventListener('click', function(){ closeSidepage(); closePopup(); });
document.getElementById('searchInput').addEventListener('input', function(){ renderGrid(filteredContacts()); });

document.getElementById('addBtn').addEventListener('click', function(){
  document.getElementById('popupOverlay').classList.add('open');
  document.getElementById('scrim').classList.add('visible');
  document.getElementById('f_name').focus();
});
document.getElementById('cancelAdd').addEventListener('click', closePopup);

document.getElementById('addForm').addEventListener('submit', function(e){
  e.preventDefault();
  var name = document.getElementById('f_name').value.trim();
  if(!name) return;
  var id = 'new-' + Date.now();
  contacts.unshift({
    id: id,
    name: name,
    role: document.getElementById('f_role').value.trim() || '—',
    dept: document.getElementById('f_dept').value.trim() || '—',
    phone: document.getElementById('f_phone').value.trim() || '—',
    email: document.getElementById('f_email').value.trim() || '—'
  });
  closePopup();
  renderGrid(filteredContacts());
  showToast('Контакт «' + name + '» добавлен');
});

renderGrid(contacts);

</script>
